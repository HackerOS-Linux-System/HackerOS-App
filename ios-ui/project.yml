name: HackerOS
options:
  bundleIdPrefix: com.hackeros
  deploymentTarget:
    iOS: "16.0"
  # Without this, XcodeGen writes the newest project file format it knows (xcode16_0, object
  # version 77), which the Xcode installed on the CI runner (15.x) refuses to open:
  # "cannot be opened because it is in a future Xcode project file format". Pin it to a format
  # Xcode 15 understands. Bump this once the CI runner's default Xcode is upgraded.
  projectFormat: xcode15_0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8"
    CURRENT_PROJECT_VERSION: "10"
targets:
  HackerOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackeros.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
